name: Publish MUDAM demo

on:
  push:
    branches: [main]
    paths:
      - index.html
      - VIZYON.html
      - demo/**
      - .github/workflows/publish-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mudam-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /VIZYON.html
            /demo/
          persist-credentials: false
      - name: Prepare web files
        run: |
          mkdir site
          cp -R index.html VIZYON.html demo site/
          test -s site/index.html
          test -s site/VIZYON.html
          test -s site/demo/data/final-demo.json
          test "$(du -sb site | cut -f1)" -lt 1000000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
